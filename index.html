<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>10.31 CCCFC Fall Festival 敬拜歌谱册</title>
<style>
  :root{
    --bg:#f6f3ec;
    --panel:#ffffff;
    --text:#2b2520;
    --muted:#80766a;
    --accent:#a9532f;
    --accent2:#5c7a5a;
    --border:#e3dccb;
    --chord:#a9532f;
    --chip-bg:#efe6d4;
    --shadow:0 2px 10px rgba(60,45,20,0.08);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --serif: "Songti SC","Noto Serif SC", "PingFang SC", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  [data-theme="dark"]{
    --bg:#15130f;
    --panel:#211d17;
    --text:#f1ece1;
    --muted:#a69a87;
    --accent:#e79a6b;
    --accent2:#8fb98c;
    --border:#39332a;
    --chord:#f0b084;
    --chip-bg:#2c2619;
    --shadow:0 2px 14px rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--serif);
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  a{color:var(--accent);}
  header.topbar{
    position:sticky; top:0; z-index:50;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    box-shadow:var(--shadow);
    padding:10px 14px;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  header.topbar .brand{
    font-weight:700; font-size:15px; cursor:pointer; white-space:nowrap;
  }
  header.topbar .brand small{display:block; font-weight:400; color:var(--muted); font-size:11px;}
  header.topbar .spacer{flex:1;}
  .iconbtn{
    border:1px solid var(--border); background:var(--panel); color:var(--text);
    border-radius:8px; padding:7px 10px; cursor:pointer; font-size:14px; line-height:1;
  }
  .iconbtn:active{transform:translateY(1px);}
  #search{
    border:1px solid var(--border); border-radius:8px; padding:8px 10px;
    font-size:14px; background:var(--bg); color:var(--text); min-width:0; flex:1; max-width:260px;
  }
  main{max-width:900px; margin:0 auto; padding:14px;}

  /* --- Song list --- */
  .songcard{
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; margin-bottom:9px; box-shadow:var(--shadow);
    cursor:pointer; display:flex; align-items:center; gap:12px;
  }
  .songcard:active{transform:scale(0.995);}
  .songcard .num{
    font-family:var(--mono); color:var(--muted); font-size:13px; width:26px; flex:none;
  }
  .songcard .titles{flex:1; min-width:0;}
  .songcard .titles .en{font-weight:700; font-size:15.5px;}
  .songcard .titles .cn{color:var(--muted); font-size:13px; margin-top:1px;}
  .songcard .tags{flex:none; text-align:right; font-size:11.5px; color:var(--muted); line-height:1.5;}
  .songcard .tags .key{
    display:inline-block; background:var(--chip-bg); color:var(--accent); font-weight:700;
    border-radius:6px; padding:2px 7px; font-family:var(--mono);
  }
  .emptystate{text-align:center; color:var(--muted); padding:40px 10px;}

  /* --- Song detail --- */
  .backrow{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .navbtns{display:flex; gap:6px;}
  .songhead h1{font-size:21px; margin:2px 0 0;}
  .songhead .cn{color:var(--muted); font-size:16px; margin-top:2px;}
  .metarow{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 2px;}
  .chip{
    background:var(--chip-bg); border-radius:999px; padding:4px 10px; font-size:12px; color:var(--text);
  }
  .credits{color:var(--muted); font-size:12.5px; margin:6px 0 0; line-height:1.6;}
  .credits a{word-break:break-word;}

  .keybar{
    position:sticky; top:52px; z-index:40;
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    box-shadow:var(--shadow);
    padding:10px 12px; margin:14px 0; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .keybar .label{font-size:12px; color:var(--muted);}
  .keybar select{
    font-family:var(--mono); font-weight:700; font-size:15px; color:var(--accent);
    border:1px solid var(--border); border-radius:8px; padding:6px 8px; background:var(--bg);
  }
  .steplabel{font-family:var(--mono); font-weight:700; font-size:13px; min-width:34px; text-align:center;}
  .capo-hint{font-size:12px; color:var(--accent2); flex:1 1 100%; margin-top:2px;}
  .fontctrl{display:flex; gap:4px; margin-left:auto;}
  .modebar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex:1 1 100%; margin-top:4px; padding-top:8px; border-top:1px solid var(--border);}
  .segctrl{display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  .segbtn{
    border:none; background:var(--panel); color:var(--text); padding:7px 10px; font-size:12.5px; cursor:pointer;
  }
  .segbtn + .segbtn{border-left:1px solid var(--border);}
  .segbtn.active{background:var(--accent); color:#fff;}

  .section{margin:18px 0;}
  .section .seclabel{
    font-size:12.5px; font-weight:700; color:var(--accent2);
    text-transform:none; margin-bottom:6px; letter-spacing:.2px;
  }
  .line{
    overflow-x:auto; -webkit-overflow-scrolling:touch; margin-bottom:2px;
    padding-bottom:2px;
  }
  .line .chordrow, .line .lyricrow{
    white-space:pre; font-family:var(--mono); line-height:1.35;
  }
  .line .chordrow{color:var(--chord); font-weight:700; min-height:1.3em;}
  .line .chordrow .ch{color:var(--chord);}
  .line .lyricrow{color:var(--text);}
  .chordonly .lyricrow{display:none;}

  .songfoot{display:flex; justify-content:space-between; margin-top:26px; gap:10px;}
  .bigbtn{
    flex:1; text-align:center; background:var(--panel); border:1px solid var(--border);
    border-radius:10px; padding:12px; cursor:pointer; font-size:14px;
  }

  /* --- Capo table --- */
  table.capo{width:100%; border-collapse:collapse; font-size:13px; margin-top:10px;}
  table.capo th, table.capo td{
    border:1px solid var(--border); padding:7px 8px; text-align:center; font-family:var(--mono);
  }
  table.capo th{background:var(--chip-bg);}
  .note{color:var(--muted); font-size:13px; line-height:1.6; margin:10px 0;}

  footer.app{text-align:center; color:var(--muted); font-size:11.5px; padding:20px 14px;}

  @media print{
    header.topbar, .keybar .fontctrl, .navbtns, .songfoot, #search, .iconbtn{display:none !important;}
    .keybar{position:static; box-shadow:none;}
    body{background:#fff; color:#000;}
    .line{overflow:visible;}
  }
</style>
</head>

  const n = NOTE_INDEX[note], k = NOTE_INDEX[keyNote];
  if (n === undefined || k === undefined) return note;
  return NASHVILLE_DEGREE[((n - k) % 12 + 12) % 12];
}
function chordToNashvilleToken(tok, keyNote){
  const m = tok.match(CHORD_RE);
  if (!m) return tok;
  const deg = nashvilleDegree(m[1], keyNote);
  // Nashville numbers always mark minor quality explicitly with "-", even for the
  // naturally-minor ii/iii/vi/vii degrees (so the chart is unambiguous at a glance).
  const quality = (m[2] || '').replace(/^m(?!aj)/, '-');
  const bass = m[3] ? ('/' + nashvilleDegree(m[3], keyNote)) : '';
  return deg + quality + bass;
}

// remap every chord-like token in a chord-line string via transformFn, while preserving
// column alignment with the lyric row below as much as possible (pads/trims the
// whitespace gap right after a token whose rendered length changed).
function remapChordLine(line, transformFn){
  if (!line) return line;
  const matches = [...line.matchAll(/\S+/g)];
  let result = '';
  let cursor = 0;
  for (const m of matches){
    const tok = m[0];
    const start = m.index;
    if (!isChordToken(tok)) continue;
    result += line.slice(cursor, start);
    const newTok = transformFn(tok);
    result += newTok;
    cursor = start + tok.length;
    const diff = newTok.length - tok.length;
    if (diff !== 0){
      let j = cursor, wsLen = 0;
      while (j < line.length && line[j] === ' '){ wsLen++; j++; }
      if (diff > 0){
        cursor += Math.min(diff, wsLen);
      } else {
        result += ' '.repeat(-diff);
      }
    }
  }
  result += line.slice(cursor);
  return result;
}
// transpose a chord-line string while preserving column alignment as much as possible
function transposeChordLine(line, shift, flats){
  return remapChordLine(line, tok => transposeChordToken(tok, shift, flats));
}
// render a chord-line string as Nashville numbers relative to keyNote (numbers stay the
// same regardless of which key is selected - that's the point of the notation)
function nashvilleChordLine(line, keyNote){
  return remapChordLine(line, tok => chordToNashvilleToken(tok, keyNote));
}
function wrapChordsHtml(line){
  return escapeHtml(line).replace(/\S+/g, function(tok){
    if (tok === '|' || tok === '||' || tok === '-' || tok === '0') return tok;
    return '<span class="ch">'+tok+'</span>';
  });
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function keyShift(fromKey, toKey){
  const a = NOTE_INDEX[fromKey], b = NOTE_INDEX[toKey];
  if (a === undefined || b === undefined) return 0;
  return ((b - a) % 12 + 12) % 12;
}
function transposeLabelText(label, shift, flats){
  // relabel "(Key: X ...)" style annotations inside section headers
  return label.replace(/Key[:：]\s*([A-G](?:#|b)?)/g, function(full, note){
    return full.replace(note, transposeNote(note, shift, flats));
  });
}

/* ---------------- app state / routing ---------------- */
let fontScale = parseFloat(localStorage.getItem('songbook:fontScale') || '1');
let chordMode = localStorage.getItem('songbook:chordMode') || 'letters'; // 'letters' | 'number'

function setChordMode(mode){
  chordMode = mode;
  localStorage.setItem('songbook:chordMode', mode);
  route();
}
function getSongKey(song){
  return localStorage.getItem('songbook:key:' + song.id) || song.baseKey;
}
function setSongKey(song, key){
  localStorage.setItem('songbook:key:' + song.id, key);
}
function toggleTheme(){
  const el = document.body;
  const next = el.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  el.setAttribute('data-theme', next);
  localStorage.setItem('songbook:theme', next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
}
(function initTheme(){
  const saved = localStorage.getItem('songbook:theme');
  if (saved === 'dark'){
    document.body.setAttribute('data-theme','dark');
    window.addEventListener('DOMContentLoaded', function(){
      document.getElementById('themeBtn').textContent = '☀️';
    });
  }
})();

function onSearch(q){
  renderList(q);
}

function parseHash(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  if (parts[0] === 'song' && parts[1]) return {view:'song', id: parts[1], key: parts[2] || null};
  if (parts[0] === 'capo') return {view:'capo'};
  return {view:'list'};
}

function route(){
  const r = parseHash();
  if (r.view === 'song') renderSong(r.id, r.key);
  else if (r.view === 'capo') renderCapo();
  else renderList();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);

/* ---------------- views ---------------- */
function renderList(filter){
  const app = document.getElementById('app');
  const q = (filter || document.getElementById('search').value || '').trim().toLowerCase();
  const items = SONGS.filter(s => {
    if (!q) return true;
    return (s.titleEn + ' ' + s.titleCn + ' ' + s.id).toLowerCase().includes(q);
  });
  let html = '';
  if (!items.length){
    html = '<div class="emptystate">没有找到匹配的歌曲 / No songs match.</div>';
  } else {
    html = items.map(s => {
      const key = getSongKey(s);
      return `<div class="songcard" onclick="location.hash='#/song/${s.id}'">
        <div class="num">${s.id}</div>
        <div class="titles">
          <div class="en">${escapeHtml(s.titleEn)}</div>
          <div class="cn">${escapeHtml(s.titleCn)}</div>
        </div>
        <div class="tags">
          <span class="key">${key}</span><br>
          ${escapeHtml(s.meta.bpm||'')}
        </div>
      </div>`;
    }).join('');
  }
  app.innerHTML = html;
}

function renderSong(id, urlKey){
  const song = SONGS.find(s => s.id === id);
  const app = document.getElementById('app');
  if (!song){ app.innerHTML = '<div class="emptystate">未找到该歌曲</div>'; return; }

  let key = urlKey || getSongKey(song);
  if (!KEY_LIST.includes(key)) key = song.baseKey;
  setSongKey(song, key);

  const shift = keyShift(song.baseKey, key);
  const flats = FLAT_KEYS.has(key);

  const idx = SONGS.findIndex(s => s.id === id);
  const prev = SONGS[(idx - 1 + SONGS.length) % SONGS.length];
  const next = SONGS[(idx + 1) % SONGS.length];

  const keyOptions = KEY_LIST.map(k => `<option value="${k}" ${k===key?'selected':''}>${k}</option>`).join('');

  const capoRow = CAPO_TABLE.find(r => r.key === key);
  const capoHint = capoRow ? `💡 吉他 Capo 建议：${capoRow.capo}` : '';

  const metaChips = [
    song.meta.playlist ? `<span class="chip">▶ ${escapeHtml(song.meta.playlist)}</span>` : '',
    song.meta.timeSig ? `<span class="chip">${escapeHtml(song.meta.timeSig)}</span>` : '',
    song.meta.bpm ? `<span class="chip">${escapeHtml(song.meta.bpm)}</span>` : '',
    song.meta.language ? `<span class="chip">${escapeHtml(song.meta.language)}</span>` : '',
    `<span class="chip">原调标注：${escapeHtml(song.meta.keyLabel||song.baseKey)}</span>`,
  ].join('');

  const sectionsHtml = song.sections.map(sec => {
    const secLabel = transposeLabelText(sec.label, shift, flats);
    const linesHtml = sec.lines.map(line => {
      // Nashville numbers are computed from the section's own original key and are
      // deliberately invariant to the key picker above - that's the point of the notation.
      const displayLine = chordMode === 'number'
        ? nashvilleChordLine(line.chord, sec.baseKey)
        : transposeChordLine(line.chord, shift, flats);
      const chordHtml = wrapChordsHtml(displayLine);
      const lyricHtml = escapeHtml(line.lyric || '');
      const cls = line.lyric ? 'line' : 'line chordonly';
      return `<div class="${cls}"><div class="chordrow">${chordHtml}</div><div class="lyricrow">${lyricHtml}</div></div>`;
    }).join('');
    return `<div class="section"><div class="seclabel">${escapeHtml(secLabel)}</div>${linesHtml}</div>`;
  }).join('');

  app.innerHTML = `
    <div class="backrow">
      <button class="iconbtn" onclick="location.hash='#/'">← 列表 List</button>
      <div class="navbtns">
        <button class="iconbtn" onclick="location.hash='#/song/${prev.id}'">◀ ${prev.id}</button>
        <button class="iconbtn" onclick="location.hash='#/song/${next.id}'">${next.id} ▶</button>
      </div>
    </div>
    <div class="songhead">
      <h1>${song.id}. ${escapeHtml(song.titleEn)}</h1>
      <div class="cn">${escapeHtml(song.titleCn)}</div>
    </div>
    <div class="metarow">${metaChips}</div>
    <div class="credits">
      敬拜团队/词曲：${escapeHtml(song.meta.credits||'')}<br>
      资源直达：${escapeHtml(song.meta.links||'')}
    </div>

    <div class="keybar">
      <span class="label">变调 Key:</span>
      <select onchange="location.hash='#/song/${song.id}/'+this.value">${keyOptions}</select>
      <button class="iconbtn" onclick="stepKey('${song.id}', -1)">−半音</button>
      <button class="iconbtn" onclick="stepKey('${song.id}', 1)">+半音</button>
      <button class="iconbtn" onclick="location.hash='#/song/${song.id}/${song.baseKey}'">还原原调 (${song.baseKey})</button>
      <div class="fontctrl">
        <button class="iconbtn" onclick="changeFont(-1)">A−</button>
        <button class="iconbtn" onclick="changeFont(1)">A+</button>
      </div>
      ${capoHint ? `<div class="capo-hint">${capoHint}</div>` : ''}
      <div class="modebar">
        <span class="label">显示 Display:</span>
        <div class="segctrl">
          <button class="segbtn ${chordMode==='letters'?'active':''}" onclick="setChordMode('letters')">和弦 Letters</button>
          <button class="segbtn ${chordMode==='number'?'active':''}" onclick="setChordMode('number')">级数 Nashville (1 2- 3- 4 5 6-)</button>
        </div>
        ${chordMode==='number' ? '<div class="capo-hint">💡 级数不随变调改变，是乐手通用的移调记谱法 / numbers stay fixed across any key</div>' : ''}
      </div>
    </div>

    <div id="chordArea" style="font-size:${fontScale}em">${sectionsHtml}</div>

    <div class="songfoot">
      <div class="bigbtn" onclick="location.hash='#/song/${prev.id}'">◀ 上一首<br><small>${escapeHtml(prev.titleEn)}</small></div>
      <div class="bigbtn" onclick="location.hash='#/song/${next.id}'">下一首 ▶<br><small>${escapeHtml(next.titleEn)}</small></div>
    </div>
  `;
}

function stepKey(id, delta){
  const song = SONGS.find(s => s.id === id);
  const cur = getSongKey(song);
  let i = KEY_LIST.indexOf(cur);
  i = ((i + delta) % 12 + 12) % 12;
  location.hash = '#/song/' + id + '/' + KEY_LIST[i];
}
function changeFont(delta){
  fontScale = Math.min(1.6, Math.max(0.7, fontScale + delta*0.1));
  localStorage.setItem('songbook:fontScale', fontScale);
  const el = document.getElementById('chordArea');
  if (el) el.style.fontSize = fontScale + 'em';
}

function renderCapo(){
  const app = document.getElementById('app');
  const rows = CAPO_TABLE.map(r => `<tr>
    <td><b>${r.key}</b></td><td>${r.I}</td><td>${r.ii}</td><td>${r.iii}</td>
    <td>${r.IV}</td><td>${r.V}</td><td>${r.vi}</td><td>${r.capo}</td>
  </tr>`).join('');
  app.innerHTML = `
    <div class="backrow"><button class="iconbtn" onclick="location.hash='#/'">← 列表 List</button></div>
    <div class="songhead"><h1>调号级数与 Capo 速查表</h1><div class="cn">Key, Nashville Number & Capo Reference</div></div>
    <p class="note">供吉他手、键盘手与领唱在现场根据歌手音域快速移调（如《Cornerstone》C/G 调切换、《Goodness of God》《Because He Lives》原调 Ab 与 G 调切换）。</p>
    <table class="capo">
      <tr><th>调号 Key</th><th>I</th><th>iim</th><th>iiim</th><th>IV</th><th>V</th><th>vim</th><th>吉他 Capo 建议</th></tr>
      ${rows}
    </table>
  `;
}

route();
</script>
</body>
</html>
